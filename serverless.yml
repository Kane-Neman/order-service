# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: ${env:SERVERLESS_ORG}
# "service" is the name of this project. This will also be added to your AWS resource names.
service: orderservice

provider:
  name: aws
  region: eu-north-1
  runtime: python3.14
  architecture: arm64
  iam: 
    role: ${env:AWS_LAMBDA_ROLE_ARN}
  httpApi:
    authorizers:
      apiKeyAuthorizer:
        type: request
        functionName: apiKeyAuthorizer
        identitySource: $request.header.x-api-key
        enableSimpleResponses: true
        resultTtlInSeconds: 0
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com

functions:
  createOrder:
    handler: functions.createOrder.lambda_function.lambda_handler
    events:
      - httpApi:
          path: /orders
          method: post
          authorizer:
            name: apiKeyAuthorizer

  getOrder:
    handler: functions.getOrder.lambda_function.lambda_handler
    events:
      - httpApi:
          path: /orders/{customerId}
          method: get
          authorizer:
            name: apiKeyAuthorizer

  cancelOrder:
    handler: functions.cancelOrder.lambda_function.lambda_handler
    events:
      - httpApi:
          path: /orders/{customerId}/{orderId}
          method: patch
          authorizer:
            name: apiKeyAuthorizer

  apiKeyAuthorizer:
    handler: functions.authorization.lambda_function.lambda_handler
    environment:
      VALID_API_KEYS: ${env:VALID_API_KEYS}

  orderHandler:
    handler: functions.orderHandler.lambda_function.lambda_handler
    environment:
      SNS_TOPIC_ARN: ${env:SNS_TOPIC_ARN}
    events:
      - eventBridge:
          eventBus: default
          pattern:
            source:
              - orders.service
            detail-type:
              - OrderPlaced
              - OrderCancelled

resources:
  Resources:
    OrdersTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: orders
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: customerId
            AttributeType: S
          - AttributeName: orderId
            AttributeType: S
        KeySchema:
          - AttributeName: customerId
            KeyType: HASH
          - AttributeName: orderId
            KeyType: RANGE
